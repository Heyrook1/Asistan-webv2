<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0071E3" />
    <title>Çevrimdışı · Asistan</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #0071e3;
        --ink: #1d1d1f;
        --muted: #5d6068;
        --bg: #f7f7f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-left: 8px;
        padding: 0 18px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/icon-192.png" alt="Asistan" width="72" height="72" />
      <h1>Çevrimdışısınız</h1>
      <p>
        İnternet bağlantısı yok. Kayıtlı bir shell gösteriliyor; klinik arama,
        müsaitlik ve randevu listeleri güncel olmayabilir. Bağlantı gelince
        tekrar deneyin.
      </p>
      <div>
        <a href="/client">Asistan’a dön</a>
        <button type="button" onclick="location.reload()">Tekrar dene</button>
      </div>
    </main>
  </body>
</html>
